name: Close Linked Issues

# main がデフォルトブランチのため、develop へのマージでは GitHub 標準の
# "Closes #n" による自動クローズが働かない。その代わりにこのワークフローで閉じる。
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues linked to the merged PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const numbers = new Set();

            // 1. PR のタイトル・本文からクローズキーワード付きの参照を拾う
            //    例: "Closes #35", "fixes #1, #2", "Resolved: #3"
            const keywordRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+#\d+(?:\s*,\s*#\d+)*/gi;
            const text = `${pr.title ?? ''}\n${pr.body ?? ''}`;
            for (const match of text.matchAll(keywordRe)) {
              for (const ref of match[0].matchAll(/#(\d+)/g)) {
                numbers.add(Number(ref[1]));
              }
            }

            // 2. Development サイドバーなどでリンクされた Issue を GraphQL で取得する
            try {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 50) {
                        nodes {
                          number
                          repository { nameWithOwner }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, number: pr.number },
              );
              const nodes = result.repository.pullRequest.closingIssuesReferences.nodes;
              for (const node of nodes) {
                if (node.repository.nameWithOwner.toLowerCase() === `${owner}/${repo}`.toLowerCase()) {
                  numbers.add(node.number);
                }
              }
            } catch (error) {
              core.warning(`closingIssuesReferences の取得に失敗しました: ${error.message}`);
            }

            if (numbers.size === 0) {
              core.info('リンクされた Issue はありません');
              return;
            }

            for (const issue_number of [...numbers].sort((a, b) => a - b)) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number }));
              } catch (error) {
                core.warning(`#${issue_number} を取得できませんでした: ${error.message}`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`#${issue_number} は PR なのでスキップします`);
                continue;
              }
              if (issue.state !== 'open') {
                core.info(`#${issue_number} はすでにクローズされています`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `#${pr.number} が develop にマージされたためクローズしました`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`#${issue_number} をクローズしました`);
            }
