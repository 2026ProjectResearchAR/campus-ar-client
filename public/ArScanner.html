<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARスキャナー | ARCloud（あるくろーど）</title>
    <meta name="application-name" content="ARCloud" />
    <meta name="description" content="ARCloudのARスキャナーです。施設のマーカーをカメラに映してARを体験できます。" />
    <link rel="stylesheet" href="/brand/theme.css" />
    <style>
      .scan-guide {
        position: fixed;
        z-index: 10;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        margin: 0 auto;
        padding: 12px 16px;
        border-radius: var(--ar-radius-card);
        background: color-mix(in srgb, var(--ar-overlay) 92%, transparent);
        color: var(--ar-surface);
        font: 500 14px/1.6 "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
        pointer-events: none;
      }
      .scan-guide svg {
        flex-shrink: 0;
        color: var(--ar-yellow);
      }
    </style>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <script>
      /**
       * 右手系 Z-up から 右手系 Y-up への座標系変換コンポーネント
       * モデルがロードされた時点で Three.js のメッシュに対して X 軸回転を適用する
       * デフォルト: -90度 (X軸周りに -90° 回転して Z軸を Y軸(上) へ向ける)
       */
      AFRAME.registerComponent("right-z-to-y-up", {
        schema: {
          deg: { type: "number", default: -90 },
        },
        init: function () {
          var el = this.el;
          var self = this;
          el.addEventListener("model-loaded", function (e) {
            var model = e.detail.model || el.getObject3D("mesh");
            if (model) {
              model.rotation.x = THREE.MathUtils.degToRad(self.data.deg);
              console.log("[AR] Converted Right-Handed Z-up to Y-up (rotation.x = " + self.data.deg + " deg)");
            }
          });
        },
        update: function () {
          var model = this.el.getObject3D("mesh");
          if (model) {
            model.rotation.x = THREE.MathUtils.degToRad(this.data.deg);
          }
        },
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="scan-guide" role="status">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M7 12h10" />
      </svg>
      施設のマーカーをカメラに映してください
    </div>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- 照明設定: 3Dモデルを明るく照らす -->
      <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
      <a-entity light="type: directional; intensity: 1.0;" position="1 3 2"></a-entity>

      <a-marker preset="hiro" data-marker-id="hiro">
        <!-- マーカーの認識を示す基準の赤いリング -->
        <a-ring
          color="#b53030"
          radius-inner="0.45"
          radius-outer="0.5"
          rotation="-90 0 0"
          opacity="0.8"
        ></a-ring>

        <!-- 3D モデル本体 (GLB): right-z-to-y-up コンポーネントを適用 -->
        <a-entity
          data-model
          right-z-to-y-up="deg: -90"
          position="0 0.05 0"
          scale="0.2 0.2 0.2"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      // Hiro マーカー検知時に三好研究室のマーカーIDへマッピング
      var MARKER_IDS = { hiro: "marker_miyoshilab" };

      function markerIdOf(el) {
        var key = el.getAttribute("data-marker-id");
        return MARKER_IDS[key] || key;
      }

      function notify(type, el) {
        window.parent.postMessage({ type: type, markerId: markerIdOf(el) }, "*");
      }

      document.querySelectorAll("a-marker[data-marker-id]").forEach(function (el) {
        el.addEventListener("markerFound", function () {
          console.log("[AR] Marker found:", markerIdOf(el));
          notify("markerFound", el);
        });
        el.addEventListener("markerLost", function () {
          console.log("[AR] Marker lost:", markerIdOf(el));
          notify("markerLost", el);
        });

        var model = el.querySelector("[data-model]");
        if (model) {
          model.addEventListener("model-loaded", function () {
            console.log("[AR] 3D Model successfully loaded!");
          });
          model.addEventListener("model-error", function (e) {
            console.error("[AR] 3D Model load error:", e.detail);
            notify("modelError", el);
          });
        }
      });

      // 親ウィンドウ (ArScanView) から 3D モデルの URL を受信したときの処理
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.type !== "showModel" || typeof data.markerId !== "string") return;

        console.log("[AR] showModel message received:", data.url);

        document.querySelectorAll("a-marker[data-marker-id]").forEach(function (el) {
          if (markerIdOf(el) !== data.markerId) return;
          var model = el.querySelector("[data-model]");
          if (!model) return;

          if (typeof data.url === "string" && data.url) {
            // すでに同じモデルが設定されている場合は再設定しない
            if (model.getAttribute("gltf-model") === data.url) return;
            console.log("[AR] Applying gltf-model:", data.url);
            model.setAttribute("gltf-model", data.url);
            model.setAttribute("visible", true);
          } else {
            model.removeAttribute("gltf-model");
            model.setAttribute("visible", false);
          }
        });
      });
    </script>
  </body>
</html>
