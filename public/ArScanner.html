<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <!-- QR コード認識用ライブラリ (jsQR) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
      /**
       * 右手系 Z-up から 右手系 Y-up への座標系変換コンポーネント
       */
      AFRAME.registerComponent("right-z-to-y-up", {
        schema: {
          deg: { type: "number", default: -90 },
        },
        init: function () {
          var el = this.el;
          var self = this;
          el.addEventListener("model-loaded", function (e) {
            var model = e.detail.model || el.getObject3D("mesh");
            if (model) {
              model.rotation.x = THREE.MathUtils.degToRad(self.data.deg);
              console.log("[AR] Converted Right-Handed Z-up to Y-up:", self.data.deg, "deg");
            }
          });
        },
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- 照明設定: 3Dモデルを明るく照らす -->
      <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
      <a-entity light="type: directional; intensity: 1.0;" position="1 3 2"></a-entity>

      <a-marker preset="hiro" data-marker-id="hiro">
        <!-- マーカーの認識を示す基準の赤いリング -->
        <a-ring
          color="#c8161d"
          radius-inner="0.45"
          radius-outer="0.5"
          rotation="-90 0 0"
          opacity="0.8"
        ></a-ring>

        <!-- 3D モデル本体 (GLB) -->
        <a-entity
          data-model
          right-z-to-y-up="deg: -90"
          position="0 0.05 0"
          scale="0.2 0.2 0.2"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      // Hiro マーカー検知時に三好研究室のマーカーIDへマッピング
      var MARKER_IDS = { hiro: "marker_miyoshilab" };

      function markerIdOf(el) {
        var key = el.getAttribute("data-marker-id");
        return MARKER_IDS[key] || key;
      }

      function notify(type, el) {
        window.parent.postMessage({ type: type, markerId: markerIdOf(el) }, "*");
      }

      document.querySelectorAll("a-marker[data-marker-id]").forEach(function (el) {
        el.addEventListener("markerFound", function () {
          console.log("[AR] Marker found:", markerIdOf(el));
          notify("markerFound", el);
        });
        el.addEventListener("markerLost", function () {
          console.log("[AR] Marker lost:", markerIdOf(el));
          notify("markerLost", el);
        });

        var model = el.querySelector("[data-model]");
        if (model) {
          model.addEventListener("model-loaded", function () {
            console.log("[AR] 3D Model successfully loaded!");
          });
          model.addEventListener("model-error", function (e) {
            console.error("[AR] 3D Model load error:", e.detail);
            notify("modelError", el);
          });
        }
      });

      // 親ウィンドウ (ArScanView) から 3D モデルの URL を受信したときの処理
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.type !== "showModel" || typeof data.markerId !== "string") return;

        console.log("[AR] showModel message received:", data.url);

        document.querySelectorAll("a-marker[data-marker-id]").forEach(function (el) {
          if (markerIdOf(el) !== data.markerId) return;
          var model = el.querySelector("[data-model]");
          if (!model) return;

          if (typeof data.url === "string" && data.url) {
            if (model.getAttribute("gltf-model") === data.url) return;
            console.log("[AR] Applying gltf-model:", data.url);
            model.setAttribute("gltf-model", data.url);
            model.setAttribute("visible", true);
          } else {
            model.removeAttribute("gltf-model");
            model.setAttribute("visible", false);
          }
        });
      });

      // ------------------------------------------------------------------
      // QR コードリアルタイム検出ループ (AR.js のカメラ映像から jsQR で認識)
      // ------------------------------------------------------------------
      var qrCanvas = document.createElement("canvas");
      var qrCtx = qrCanvas.getContext("2d", { willReadFrequently: true });
      var lastQrCheck = 0;
      var lastReportedQr = null;

      function scanQRCodeLoop() {
        requestAnimationFrame(scanQRCodeLoop);

        var now = Date.now();
        if (now - lastQrCheck < 250) return; // 250ms 間隔でチェック
        lastQrCheck = now;

        var video = document.querySelector("#arjs-video") || document.querySelector("video");
        if (!video || video.readyState < 2 || video.videoWidth === 0) return;

        // 計算負荷軽減のため最大幅 640px にスケールダウン
        var maxDim = 640;
        var scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
        qrCanvas.width = Math.floor(video.videoWidth * scale);
        qrCanvas.height = Math.floor(video.videoHeight * scale);

        qrCtx.drawImage(video, 0, 0, qrCanvas.width, qrCanvas.height);
        var imageData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);

        if (window.jsQR) {
          var code = window.jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert",
          });
          if (code && code.data) {
            if (code.data !== lastReportedQr) {
              lastReportedQr = code.data;
              console.log("[AR] QR Code detected:", code.data);
              // 親ウィンドウへ QR 検出イベントを送信
              window.parent.postMessage({ type: "qrFound", url: code.data }, "*");
              setTimeout(function () {
                lastReportedQr = null;
              }, 4000);
            }
          }
        }
      }

      window.addEventListener("load", function () {
        setTimeout(scanQRCodeLoop, 1500);
      });
    </script>
  </body>
</html>
